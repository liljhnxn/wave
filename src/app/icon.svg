<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="waveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#16181d" />
      <stop offset="100%" stop-color="#0f1013" />
    </linearGradient>
    <linearGradient id="waveBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#waveBg)" stroke="url(#waveBorder)" stroke-width="1.5" />
  
  <!-- Waving Hand Symbol -->
  <text x="16" y="22" font-size="16" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">
    👋
  </text>
</svg>
